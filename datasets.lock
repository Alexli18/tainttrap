# Pinned datasets (research R-12, FR-037). Each entry:
#   {name, url, version_sha, license, commercial_use: bool, allowed_split: train|eval_only,
#    contents, notes}
# Data is downloaded into ~/.cache/tainttrap-data/ (outside git), never into the repository.
# Checked 2026-10-11.
datasets:
  - name: swe-hero-openhands-trajectories
    url: https://huggingface.co/datasets/nvidia/SWE-Hero-openhands-trajectories
    version_sha: 150bc119e52c647216fce285fd801f16b6fd745b
    license: CC-BY-4.0
    commercial_use: true
    allowed_split: train
    contents: >-
      34,269 OpenHands trajectories (11,766 issues from SWE-Gym, SWE-Gym-Raw, R2E-Gym-Subset and
      SWE-rebench), every step a real tool call with its output: execute_bash,
      str_replace_editor, think, finish. Benign coding-agent work; ~34 bash calls per trajectory.
    notes: >-
      Attribution: NVIDIA, "From SWE-ZERO to SWE-HERO" (arXiv 2604.01496). The license column
      holds each source repository's license (MIT, Apache-2.0, BSD-2/3-Clause, MIT-0). The 400
      trajectories in eval/real_traces/sample.json (shard data/train-00013-of-00014.parquet,
      sha256 936b195e...) are held out for evaluation; the rest may become benign training
      records after `python -m eval.holdout check`.
  - name: nemotron-swe-v1
    url: https://huggingface.co/datasets/nvidia/Nemotron-SWE-v1
    version_sha: 0fe17a965b297a9c943a59050a14c42d5f0083ce
    license: CC-BY-4.0 (some subsets BSD-3-Clause, per the dataset viewer)
    commercial_use: true
    allowed_split: train
    contents: >-
      OpenHands trajectories (split r2e_gym, one 11.1 GB JSONL; the card says 51,029 rows),
      same tools and system prompt as SWE-Hero, issues from SWE-Gym and R2E-Gym-Subset.
    notes: >-
      A sibling run of SWE-Hero on largely the same issues (no identical trajectories found in
      6,000 compared), so records sharing an issue with the held-out SWE-Hero sample are
      rejected by the holdout check. Attribution: NVIDIA. Some license values are GitHub URLs,
      not SPDX ids.
  - name: ipi-arena-attacks
    url: https://huggingface.co/datasets/sureheremarv/ipi_arena_attacks
    version_sha: 2ef2d9785ed50981832b199ac89e6a0ff85d666d
    license: MIT
    commercial_use: true
    allowed_split: eval_only
    contents: >-
      95 injection strings for 28 behaviors (no scenario, no target call; those are in
      GraySwanAI/ipi_arena_os). Generated by Qwen3-VL-235B; succeeded on open models.
    notes: Six behavior_id values have a leading space. Used only as injection variants in eval scenarios.
  - name: ipi-arena-os
    url: https://github.com/GraySwanAI/ipi_arena_os
    version_sha: 5e2e285910d581c97767195f1d113ef323f9ab07
    license: MIT
    commercial_use: true
    allowed_split: eval_only
    contents: >-
      Behavior definitions for IPI Arena: system prompt, messages with a {fill} slot (usually in a
      tool message), tool schemas and a tool_judge naming the target tool and expected arguments.
    notes: Needed to know each IPI Arena attack's goal; eval only, like the attacks.
  - name: agent-security-bench
    url: https://github.com/agiresearch/ASB
    version_sha: 544540ff0788998072f7df463056fd17e62cc9f4
    license: MIT
    commercial_use: true
    allowed_split: eval_only
    contents: >-
      data/: 10 agents with prose tasks, 400 attacker tools and 20 normal tools (name,
      instruction, goal); memory-poisoning data only as Chroma binaries. No arguments: every
      tool has parameters None and an attack succeeds when the named tool is called.
    notes: >-
      Not converted: harmful calls would need invented arguments and the tool names are
      fictional. data/agent_task_pot_all.jsonl is a GitHub rate-limit HTML page upstream.
      Kept eval_only (named as a held-out benchmark in eval/holdout.py).
  - name: dtap-bench-agent-trajectories
    url: https://huggingface.co/datasets/AI-Secure/DTap-Bench-Agent-Trajectories
    version_sha: 836caf2fdd78b888ddd14fb62dc038e932e17898
    license: Apache-2.0
    commercial_use: true  # pending: see notes
    allowed_split: train
    contents: >-
      Recorded multi-step runs (3.75 GB, 133,726 JSON files) of 10 agent/model pairs (Claude,
      GPT, Gemini, gpt-oss via four SDKs) on the 6,682 DTap tasks (2,806 benign, 1,878 direct,
      1,998 indirect) in 14 domains on MCP servers; each step has tool name, concrete tool_params
      and the tool output, plus judge_result.json (task_success, attack_success). The card's
      README is copied from the platform repo, hence its pointer there.
    notes: >-
      Not built on AgentDojo, InjecAgent, ASB, AgentHarm, IPI Arena or WASP (cited only as
      related work). 49 Windows tasks are adapted from OSWorld (Task.osworld_id), the browser
      site from WebArena, medical scenarios from MedQA. 769 indirect tasks inject only through
      tool descriptions, which TaintTrap never reads, so their attacker values have no
      tool-output provenance. Judges are noisy. Decision needed before training: the runs are
      outputs of Anthropic, OpenAI and Google models, whose output-use terms apply; and
      upstream licences of OSWorld, WebArena, MedQA, yfinance and CourtListener data are
      unverified. Fixture credentials in configs (e.g. mcp-secret-123) must be masked.
  - name: decodingtrust-agent-platform
    url: https://huggingface.co/datasets/AI-Secure/DecodingTrust-Agent-Platform
    version_sha: a3edc9b7c48cbf16c2ea9c18990fb94c7494dd04
    license: Apache-2.0
    commercial_use: true
    allowed_split: train
    contents: >-
      The 6,682 DTap task specs (config.yaml, setup.sh, judge.py, seed data); no runs. Harmful
      goals are prose (Attack.malicious_goal); injected content is in attack_steps kwargs.
    notes: Used with the trajectories to recover the user task and the injected content.
