# Weekly dependency and action updates, grouped so they arrive as few PRs.
# Security updates are grouped separately so they are never held back.
# Pattern taken from ECC's dependabot.yml.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      python-security:
        applies-to: "security-updates"
        patterns: ["*"]
      python-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "ci"]
    groups:
      actions:
        patterns: ["*"]
