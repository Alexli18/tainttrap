# Release on a version tag (vX.Y.Z): verify, build, publish to PyPI with
# Trusted Publishing (no API token exists) and PEP 740 attestations, then
# create the GitHub release with generated notes.
#
# One-time setup:
#   1. On PyPI, add a trusted publisher for this repository:
#      workflow "release.yml", environment "pypi".
#   2. On GitHub, create the environment "pypi" (Settings > Environments),
#      allow deployments only from tags matching "v*", and require a reviewer,
#      so a pushed tag alone cannot publish.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Tag matches package version
        # pyproject.toml has a static `version` in [project].
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject version $version" >&2
            exit 1
          fi

      - name: Changelog has this version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          pattern="^## \[?${version//./\\.}\]?( |$)"
          grep -qE "$pattern" CHANGELOG.md || {
            echo "CHANGELOG.md has no section for $version" >&2; exit 1; }

      - name: No unresolved markers or placeholders
        # The brackets keep the pattern from matching this file. grep must exit
        # with exactly 1: 0 means a marker remains, 2 means a path is missing.
        run: |
          set +e
          grep -rnE 'VERIF[Y]|OWNER/RE[P]O' README.md SECURITY.md docs .github .gitleaks.toml .claude
          rc=$?
          set -e
          if [ "$rc" -ne 1 ]; then
            echo "Unresolved markers or placeholders remain, or a documented path is missing (grep exit $rc)." >&2
            exit 1
          fi

      - name: Install
        # `dev` is an optional extra; `cpu` and `gpu` conflict, so no --all-extras.
        run: uv sync --locked --extra dev --extra data

      - name: Lint, types, tests
        run: |
          uv run ruff check src tests eval scripts
          uv run ruff format --check src tests eval scripts
          uv run mypy
          uv run pytest -m "not model and not slow and not ollama and not audit"
          uv run pytest -m audit
          uv run python scripts/check_hook_imports.py

  secret-scan:
    # Tags do not trigger CI, so the release repeats the secret scan itself.
    name: Secret scan (files and history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum-verified)
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" "$url"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks

      - name: Scan files and history
        run: |
          "$RUNNER_TEMP/gitleaks" dir --redact --config .gitleaks.toml .
          "$RUNNER_TEMP/gitleaks" git --redact --config .gitleaks.toml .

  build:
    name: Build
    needs: [verify, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Build sdist and wheel
        run: uv build

      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/tainttrap # `name` in pyproject.toml
    permissions:
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true

  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flags=(--generate-notes --verify-tag)
          case "$GITHUB_REF_NAME" in
            *a*|*b*|*rc*) flags+=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" "${flags[@]}"
